<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Formateur de texte pour LinkedIn & Instagram (Gratuit)</title>
<style>
:root{--ink:#17233b;--muted:#66758b;--blue:#5b5ce2;--line:#e5e9f2;}
body{margin:0;font:14px/1.5 Inter,sans-serif;color:var(--ink);background:#fff;}
.top{display:flex;justify-content:space-between;padding:15px 30px;border-bottom:1px solid var(--line);}
.brand{font-weight:850;font-size:20px;display:flex;gap:10px;align-items:center;}
.brandmark{width:32px;height:32px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;}
.container{max-width:800px;margin:30px auto;padding:20px;text-align:center;}
textarea{width:100%;height:150px;padding:10px;border:1px solid #ccc;border-radius:8px;font:inherit;margin-bottom:15px;resize:vertical;}
.primary{background:var(--blue);color:#fff;padding:14px;border:0;border-radius:10px;font-weight:800;font-size:16px;cursor:pointer;width:100%;}
select{padding:8px;border-radius:8px;border:1px solid #ccc;margin-left:auto;}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><div class="brandmark">S</div> PostFormat</div>
  <select onchange="changeLang(this.value)"><option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option><option value="es">🇪🇸 ES</option><option value="pt">🇧🇷 PT</option></select>
</div>
<div class="container">
  <h1 id="t_title">Mettez en forme vos posts</h1>
  <p id="t_sub" style="color:var(--muted);margin-bottom:20px;">Entourez vos mots de ** pour les mettre en gras, et de * pour l'italique.</p>
  <textarea id="inputText" placeholder="Je suis **très heureux** de vous annoncer..."></textarea>
  <button class="primary" id="btnFormat" onclick="formatText()">Mettre en forme</button>
  <div id="resultBox" style="display:none;margin-top:20px;">
    <textarea id="outputText" readonly></textarea>
  </div>
</div>
<script>
const dict = {
  fr: { title: "Mettez en forme vos posts", sub: "Entourez vos mots de ** pour les mettre en gras, et de * pour l'italique.", btn: "Mettre en forme" },
  en: { title: "Format your posts", sub: "Wrap your words with ** for bold, and * for italic.", btn: "Format text" },
  es: { title: "Formatea tus publicaciones", sub: "Envuelve tus palabras con ** para negrita, y * para cursiva.", btn: "Formatear texto" },
  pt: { title: "Formate seus posts", sub: "Envolva suas palavras com ** para negrito, e * para itálico.", btn: "Formatar texto" }
};
let currentLang = 'fr';
window.changeLang = (l) => { currentLang = l; const t = dict[l]; document.getElementById('t_title').textContent = t.title; document.getElementById('t_sub').textContent = t.sub; document.getElementById('btnFormat').textContent = t.btn; };

// --- FONCTION MAGIQUE : Conversion en caractères Unicode ---
function toBold(text) {
  const boldMap = {
    'a': '𝗮', 'b': '𝗯', 'c': '𝗰', 'd': '𝗱', 'e': '𝗲', 'f': '𝗳', 'g': '𝗴', 'h': '𝗵', 'i': '𝗶', 'j': '𝗷', 'k': '𝗸', 'l': '𝗹', 'm': '𝗺',
    'n': '𝗻', 'o': '𝗼', 'p': '𝗽', 'q': '𝗾', 'r': '𝗿', 's': '𝘀', 't': '𝘁', 'u': '𝘂', 'v': '𝘃', 'w': '𝘄', 'x': '𝘅', 'y': '𝘆', 'z': '𝘇',
    'A': '𝗔', 'B': '𝗕', 'C': '𝗖', 'D': '𝗗', 'E': '𝗘', 'F': '𝗙', 'G': '𝗚', 'H': '𝗛', 'I': '𝗜', 'J': '𝗝', 'K': '𝗞', 'L': '𝗟', 'M': '𝗠',
    'N': '𝗡', 'O': '𝗢', 'P': '𝗣', 'Q': '𝗤', 'R': '𝗥', 'S': '𝗦', 'T': '𝗧', 'U': '𝗨', 'V': '𝗩', 'W': '𝗪', 'X': '𝗫', 'Y': '𝗬', 'Z': '𝗭',
    '0': '𝟬', '1': '𝟭', '2': '𝟮', '3': '𝟯', '4': '𝟰', '5': '𝟱', '6': '𝟲', '7': '𝟳', '8': '𝟴', '9': '𝟵'
  };
  return text.split('').map(c => boldMap[c] || c).join('');
}

function toItalic(text) {
  const italicMap = {
    'a': '𝘢', 'b': '𝘣', 'c': '𝘤', 'd': '𝘥', 'e': '𝘦', 'f': '𝘧', 'g': '𝘨', 'h': '𝘩', 'i': '𝘪', 'j': '𝘫', 'k': '𝘬', 'l': '𝘭', 'm': '𝘮',
    'n': '𝘯', 'o': '𝘰', 'p': '𝘱', 'q': '𝘲', 'r': '𝘳', 's': '𝘴', 't': '𝘵', 'u': '𝘶', 'v': '𝘷', 'w': '𝘸', 'x': '𝘹', 'y': '𝘺', 'z': '𝘻',
    'A': '𝘈', 'B': '𝘉', 'C': '𝘊', 'D': '𝘋', 'E': '𝘌', 'F': '𝘍', 'G': '𝘎', 'H': '𝘏', 'I': '𝘐', 'J': '𝘑', 'K': '𝘒', 'L': '𝘓', 'M': '𝘔',
    'N': '𝘕', 'O': '𝘖', 'P': '𝘗', 'Q': '𝘘', 'R': '𝘙', 'S': '𝘚', 'T': '𝘛', 'U': '𝘜', 'V': '𝘝', 'W': '𝘞', 'X': '𝘟', 'Y': '𝘠', 'Z': '𝘡'
  };
  return text.split('').map(c => italicMap[c] || c).join('');
}

window.formatText = () => {
  let text = document.getElementById('inputText').value;
  
  // 1. Remplacer le gras (**texte**)
  text = text.replace(/\*\*(.*?)\*\*/g, (match, p1) => toBold(p1));
  
  // 2. Remplacer l'italique (*texte*)
  text = text.replace(/\*(.*?)\*/g, (match, p1) => toItalic(p1));
  
  // 3. Ajouter des sauts de ligne après les points (pour aérer le texte)
  text = text.replace(/\. /g, '.\n\n');
  
  document.getElementById('outputText').value = text;
  document.getElementById('resultBox').style.display = 'block';
};
changeLang('fr');
</script>
</body>
</html>
